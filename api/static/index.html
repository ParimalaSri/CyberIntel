<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sales Intelligence Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { padding: 20px 24px 4px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: #666; font-size: 14px; }

  .cards { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 8px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 130px; }
  .card .n { font-size: 24px; font-weight: 700; }
  .card .l { font-size: 12px; color: #777; text-transform: uppercase; }

  .panels { display: flex; gap: 16px; padding: 0 24px 24px; flex-wrap: wrap; }
  .panel { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); flex: 1; min-width: 280px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: #444; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .bar-row .label { width: 70px; flex-shrink: 0; color: #555; }
  .bar-row .track { flex: 1; background: #eee; border-radius: 4px; height: 16px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: #0a7a3d; border-radius: 4px; }
  .bar-row .val { width: 50px; text-align: right; color: #777; flex-shrink: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  th { color: #777; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .band { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .band.contact { background: #d9f2e3; color: #0a7a3d; }
  .band.review { background: #fff3cd; color: #8a6d00; }
  .band.skip { background: #eee; color: #888; }
  .band.exclude { background: #fbe0e0; color: #a33; }

  /* chat widget, bottom-right */
  #chat-bubble { position: fixed; right: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%;
    background: #0a7a3d; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 100; }
  #chat-panel { position: fixed; right: 20px; bottom: 84px; width: 360px; height: 460px; background: #fff;
    border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.2); display: none; flex-direction: column;
    overflow: hidden; z-index: 100; }
  #chat-panel.open { display: flex; }
  #chat-header { background: #0a7a3d; color: #fff; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  #chat-log { flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .msg.user { text-align: right; }
  .msg.user span { background: #0a7a3d; color: #fff; padding: 5px 10px; border-radius: 10px; display: inline-block; }
  .msg.bot .bubble { background: #f0f0f0; padding: 6px 10px; border-radius: 10px; display: inline-block; white-space: pre-wrap; max-width: 100%; }
  .msg.bot table.chat-table { border-collapse: collapse; margin-top: 6px; font-size: 12px; background: #fff; width: 100%; }
  .msg.bot table.chat-table th, .msg.bot table.chat-table td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; }
  .msg.bot table.chat-table th { background: #f0f0f0; }
  #chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #eee; }
  #chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #chat-send { padding: 8px 12px; border: none; background: #0a7a3d; color: #fff; border-radius: 6px; cursor: pointer; }
  #chat-send:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>
  <h1>Sales Intelligence Dashboard</h1>
  <p>Gold-layer account scoring overview</p>
</header>

<div class="cards" id="cards"></div>

<div class="panels">
  <div class="panel">
    <h2>Accounts by band</h2>
    <div id="band-chart"></div>
  </div>
  <div class="panel">
    <h2>Top countries</h2>
    <div id="country-chart"></div>
  </div>
  <div class="panel">
    <h2>Resolution tier</h2>
    <div id="tier-chart"></div>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <h2>Top 20 companies by score</h2>
    <div id="top20-chart"></div>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <h2>Top scored accounts</h2>
    <table>
      <thead><tr><th>Company</th><th>Country</th><th>Score</th><th>Band</th></tr></thead>
      <tbody id="top-table"></tbody>
    </table>
  </div>
</div>

<div id="chat-bubble" onclick="toggleChat()">&#128172;</div>
<div id="chat-panel">
  <div id="chat-header">Ask the assistant</div>
  <div id="chat-log"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Ask a question..." autocomplete="off">
    <button id="chat-send">Send</button>
  </form>
</div>

<script>
  async function loadStats() {
    const res = await fetch('/api/stats');
    const s = await res.json();

    document.getElementById('cards').innerHTML = `
      <div class="card"><div class="n">${s.total.toLocaleString()}</div><div class="l">Total accounts</div></div>
      <div class="card"><div class="n">${(s.bands.find(b=>b.band==='contact')||{count:0}).count}</div><div class="l">Contact-ready</div></div>
      <div class="card"><div class="n">${(s.bands.find(b=>b.band==='review')||{count:0}).count}</div><div class="l">Needs review</div></div>
    `;

    const bandMax = Math.max(...s.bands.map(b => b.count));
    document.getElementById('band-chart').innerHTML = s.bands.map(b => `
      <div class="bar-row">
        <div class="label">${b.band}</div>
        <div class="track"><div class="fill" style="width:${b.count/bandMax*100}%"></div></div>
        <div class="val">${b.count.toLocaleString()}</div>
      </div>`).join('');

    const cMax = Math.max(...s.countries.map(c => c.count));
    document.getElementById('country-chart').innerHTML = s.countries.map(c => `
      <div class="bar-row">
        <div class="label">${c.country}</div>
        <div class="track"><div class="fill" style="width:${c.count/cMax*100}%"></div></div>
        <div class="val">${c.count.toLocaleString()}</div>
      </div>`).join('');

    const tMax = Math.max(...s.tiers.map(t => t.count));
    document.getElementById('tier-chart').innerHTML = s.tiers.map(t => `
      <div class="bar-row">
        <div class="label">${t.tier}</div>
        <div class="track"><div class="fill" style="width:${t.count/tMax*100}%"></div></div>
        <div class="val">${t.count.toLocaleString()}</div>
      </div>`).join('');

    const top20Max = Math.max(...s.top.map(r => r.score));
    document.getElementById('top20-chart').innerHTML = s.top.map(r => `
      <div class="bar-row">
        <div class="label" title="${r.company_key}">${r.company_key.length > 14 ? r.company_key.slice(0, 13) + '…' : r.company_key}</div>
        <div class="track"><div class="fill" style="width:${r.score/top20Max*100}%"></div></div>
        <div class="val">${r.score.toFixed(0)}</div>
      </div>`).join('');

    document.getElementById('top-table').innerHTML = s.top.map(r => `
      <tr>
        <td>${r.company_key}</td>
        <td>${r.country || '-'}</td>
        <td>${r.score.toFixed(1)}</td>
        <td><span class="band ${r.band}">${r.band}</span></td>
      </tr>`).join('');
  }
  loadStats();

  const chatBubble = document.getElementById('chat-bubble');
  const chatPanel = document.getElementById('chat-panel');
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  let history = [];

  function toggleChat() {
    chatPanel.classList.toggle('open');
    if (chatPanel.classList.contains('open')) chatInput.focus();
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Converts a Markdown-style pipe table in the bot's reply into a real
  // <table>; plain lines pass through escaped, since Groq answers often
  // mix a sentence with a table and textContent showed the raw "| a | b |".
  function renderBotHtml(text) {
    const lines = text.split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      const next = lines[i + 1] ? lines[i + 1].trim() : '';
      if (line.startsWith('|') && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(next)) {
        const cells = l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const header = cells(line);
        let j = i + 2;
        const rows = [];
        while (j < lines.length && lines[j].trim().startsWith('|')) {
          rows.push(cells(lines[j].trim()));
          j++;
        }
        html += '<table class="chat-table"><thead><tr>' +
          header.map(c => `<th>${escapeHtml(c)}</th>`).join('') + '</tr></thead><tbody>' +
          rows.map(r => '<tr>' + r.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>';
        i = j;
      } else {
        html += escapeHtml(lines[i]) + '\n';
        i++;
      }
    }
    return html;
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'bot') {
      div.innerHTML = `<div class="bubble">${renderBotHtml(text)}</div>`;
    } else {
      div.innerHTML = '<span></span>';
      div.querySelector('span').textContent = text;
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = chatInput.value.trim();
    if (!q) return;
    addMsg('user', q);
    history.push({ role: 'user', content: q });
    chatInput.value = '';
    chatSend.disabled = true;
    addMsg('bot', 'Thinking...');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      chatLog.lastChild.remove();
      addMsg('bot', data.answer);
      history.push({ role: 'assistant', content: data.answer });
    } catch (err) {
      chatLog.lastChild.remove();
      addMsg('bot', 'Something went wrong. Is the server running?');
    }
    chatSend.disabled = false;
    chatInput.focus();
  });
</script>
</body>
</html>
